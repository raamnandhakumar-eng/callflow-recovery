services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: callflow
      POSTGRES_USER: callflow
      POSTGRES_PASSWORD: callflow
    ports:
      - "5432:5432"
    volumes:
      - callflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callflow -d callflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://callflow:callflow@db:5432/callflow
      PUBLIC_BASE_URL: http://localhost:8000
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python scripts/seed.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  callflow_pgdata:
