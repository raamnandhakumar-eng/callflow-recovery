services:
  - type: web
    name: callflow-recovery
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: >-
      /bin/sh -c 'python scripts/seed.py && exec uvicorn app.main:app --host 0.0.0.0 --port "$PORT"'
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: callflow-recovery-db
          property: connectionString
      - key: DEFAULT_TENANT_SLUG
        value: northstar-hvac
      - key: HTTP_TIMEOUT_SECONDS
        value: "8"
      - key: MAX_EXTERNAL_RETRIES
        value: "2"
      - key: VAPI_WEBHOOK_SECRET
        generateValue: true

databases:
  - name: callflow-recovery-db
    plan: free
    region: virginia
    postgresMajorVersion: "17"
    databaseName: callflow
    user: callflow
    ipAllowList: []
