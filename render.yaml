services:
  - type: web
    name: callflow-recovery
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        value: sqlite:////tmp/callflow.db
      - key: PUBLIC_BASE_URL
        value: https://callflow-recovery.onrender.com
      - key: DEFAULT_TENANT_SLUG
        value: northstar-hvac
      - key: HTTP_TIMEOUT_SECONDS
        value: "8"
      - key: MAX_EXTERNAL_RETRIES
        value: "2"
      - key: VAPI_WEBHOOK_SECRET
        generateValue: true
